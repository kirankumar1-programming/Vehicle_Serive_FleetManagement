version: '3.8'

services:
  vehicleservice-web:
    image: vehicleservice-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - UseSqlite=true
    ports:
      - "5000:8080"
    volumes:
      - app-data:/app/data
    restart: unless-stopped

volumes:
  app-data:
