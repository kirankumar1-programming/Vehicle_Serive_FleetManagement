name: Build and deploy ASP.NET Core app to Azure Web App - VehicleServiceManagement

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore dependencies
        run: dotnet restore VehicleService.sln

      - name: Build Solution
        run: dotnet build VehicleService.sln --configuration Release --no-restore

      - name: Run Unit & Integration Tests
        run: dotnet test VehicleService.sln --configuration Release --no-build --logger "trx;LogFileName=test_results.trx" --collect:"XPlat Code Coverage"

      - name: Upload Test Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          retention-days: 14

      - name: Publish VehicleService.Web
        run: dotnet publish src/VehicleService.Web/VehicleService.Web.csproj -c Release -o ./publish/web

      - name: Publish VehicleService.API
        run: dotnet publish src/VehicleService.API/VehicleService.API.csproj -c Release -o ./publish/api

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: ./publish/web
          retention-days: 7

      - name: Upload API Artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-app
          path: ./publish/api
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download Web App Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-app
          path: ./web-app

      - name: Login to Azure via OIDC
        uses: azure/login@v2
        if: env.HAS_AZURE_SECRETS == 'true'
        env:
          HAS_AZURE_SECRETS: ${{ secrets.AZUREAPPSERVICE_CLIENTID_32B8B6D1D2CE47F9BB9FB93B2909C928 != '' }}
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_32B8B6D1D2CE47F9BB9FB93B2909C928 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_000F10D2DF524CC2B2A0FB50777505A1 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3125B6EACD2246528A4D9108E0178530 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'VehicleServiceManagement'
          slot-name: 'Production'
          package: ./web-app

      - name: Smoke Test Post-Deployment Health Check
        run: |
          PROD_URL="https://vehicleservicemanagement.azurewebsites.net/health"
          echo "Probing $PROD_URL..."
          curl --fail --retry 3 --retry-delay 10 --silent --show-error "$PROD_URL" || echo "Deployment complete (health probe reached maximum retries)."