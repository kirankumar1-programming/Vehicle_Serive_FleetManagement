name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: VehicleServiceManagement
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore Dependencies
      run: dotnet restore VehicleService.sln

    - name: Build with dotnet
      run: dotnet build VehicleService.sln --no-restore --configuration Release

    - name: Run Tests
      run: dotnet test VehicleService.sln --no-build --configuration Release --verbosity normal

    - name: dotnet publish
      run: dotnet publish src/VehicleService.Web/VehicleService.Web.csproj -c Release -o ./publish

    - name: Upload Artifact for Deployment
      uses: actions/upload-artifact@v4
      with:
        name: vehicleservice-web-app
        path: ./publish

  deploy:
    name: Deploy to Azure Web App
    runs-on: windows-latest
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Download Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: vehicleservice-web-app
        path: ./publish

    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
        package: ./publish
